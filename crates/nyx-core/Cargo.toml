# nyx-core: pure-logic crate (input validation, shared types). No libtorrent dependency, so tests are fast.
[package]
name = "nyx-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
data-encoding = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
